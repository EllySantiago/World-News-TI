name: Bot Cyber Security

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Teste: mostra os posts no log, sem enviar ao Discord'
        type: boolean
        default: false

permissions:
  contents: write   # para salvar state/cyber.json

concurrency:
  group: world-news   # as três rotinas nunca rodam ao mesmo tempo
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run_channel.yml
    with:
      channel: cyber
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
