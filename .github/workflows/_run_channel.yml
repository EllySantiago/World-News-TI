# Workflow reutilizável: roda UM canal. Os três arquivos *_news.yml chamam este.
name: Run channel

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar, resumir e postar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_IA_OSINT: ${{ secrets.DISCORD_WEBHOOK_IA_OSINT }}
          DISCORD_WEBHOOK_FRONT: ${{ secrets.DISCORD_WEBHOOK_FRONT }}
          # Opcional: resumo por IA. Sem nenhuma das duas, usa o resumo extrativo (sem API).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py ${{ inputs.channel }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Salvar o que já foi enviado
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: estado do canal ${{ inputs.channel }}"
            git pull --rebase && git push
          fi
